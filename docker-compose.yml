version: "3.8"
services:
  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: bitnami/kafka:latest
    environment:
      # используем Zookeeper (чтобы не смешивать KRaft-конфиг)
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - app-network
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["sh", "-c"]
    command: |
      "
      set -e
      i=0
      until mc alias set myminio http://minio:9000 minioadmin minioadmin >/dev/null 2>&1 || [ $i -ge 30 ]; do
        i=$((i+1))
        sleep 1
      done
      mc alias set myminio http://minio:9000 minioadmin minioadmin
      mc mb myminio/data --ignore-existing
      mc mb myminio/models --ignore-existing
      mc mb myminio/experiments --ignore-existing
      mc anonymous set public myminio/data
      mc anonymous set public myminio/models
      mc anonymous set public myminio/experiments
      "
    restart: "on-failure"
    networks:
      - app-network

  web:
    build: .
    depends_on:
      - kafka
      - postgres
      - minio
      - minio-init
    command: >
      bash -c "uvicorn src.app:app --host 0.0.0.0 --port 8090 --reload"
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC=${KAFKA_TOPIC}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - DVC_REMOTE_NAME=${DVC_REMOTE_NAME}
    image: derelia/mlops_project:latest
    networks:
      - app-network
    restart: unless-stopped

  consumer:
    image: derelia/mlops_project:latest
    depends_on:
      - kafka
      - postgres
    command: >
      bash -c "python -u src/kafka_consumer_service.py"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC=${KAFKA_TOPIC}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  minio_data:
  kafka_data:
    driver: local
